# Solario Home 0.7.54 automations: every automation of the house, a control panel for blinds and devices
name: Solario Home
version: "0.7.54"
slug: solar_portal
description: Solario Home – výroba, spotřeba, baterie a úspora vaší fotovoltaiky v Home Assistantu
url: https://solario.cloud
arch:
  - aarch64
  - amd64
image: ghcr.io/gonza11125/solario-local
webui: http://[HOST]:[PORT:3000]
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Optional direct LAN access after first setup (disabled by default; enable a host port in Network settings)
startup: application
boot: auto
stage: stable
backup: cold
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:home-energy-monitor
panel_title: Solario Home
panel_admin: true
homeassistant_api: true
# Lets the add-on switch its own automatic updates on and off with the
# subscription (update-policy.mjs), only when paid plans are enabled.
hassio_api: true
# /share is where an automatic backup is copied, so the user can pull an archive
# out with the File editor, Samba or the Terminal add-on - /data is reachable
# only from inside this add-on.
map:
  - share:rw
services:
  - mqtt:want
options:
  log_level: info
  database_name: solar_portal
  ha_automations: "[]"
  polling_interval: 5000
  anonymous_usage_stats: false
  paid_upgrades_enabled: false
  entity_power_now: ""
  entity_energy_today: ""
  entity_battery_soc: ""
  entity_battery_voltage: ""
  entity_room_temperature: ""
  entity_room_humidity: ""
  entity_hdo_switch: ""
  entity_grid_import: ""
  entity_grid_export: ""
  entity_grid_power: ""
  entity_battery_power: ""
  entity_home_consumption: ""
  entity_home_power: ""
  entity_solar_production: ""
  entity_inverter_power: ""
  entity_string_1_power: ""
  entity_string_2_power: ""
  entity_string_3_power: ""
  entity_string_4_power: ""
  entity_production_max_10min: ""
  entity_production_avg_10min: ""
  entity_ev_power: ""
  entity_ev_energy_today: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  database_name: str
  ha_automations: str
  polling_interval: int(1000,60000)
  anonymous_usage_stats: bool
  paid_upgrades_enabled: bool?
  entity_power_now: str?
  entity_energy_today: str?
  entity_battery_soc: str?
  entity_battery_voltage: str?
  entity_room_temperature: str?
  entity_room_humidity: str?
  entity_hdo_switch: str?
  entity_grid_import: str?
  entity_grid_export: str?
  entity_grid_power: str?
  entity_battery_power: str?
  entity_home_consumption: str?
  entity_home_power: str?
  entity_solar_production: str?
  entity_inverter_power: str?
  entity_string_1_power: str?
  entity_string_2_power: str?
  entity_string_3_power: str?
  entity_string_4_power: str?
  entity_production_max_10min: str?
  entity_production_avg_10min: str?
  entity_ev_power: str?
  entity_ev_energy_today: str?
environment:
  NODE_ENV: production

