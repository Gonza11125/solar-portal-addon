name: Patch public release 0.6.42

on:
  push:
    branches:
      - release/0.6.42
    paths:
      - scripts/patch-release-0.6.42.mjs
      - .github/workflows/patch-release-0.6.42.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/0.6.42

      - name: Apply public release metadata
        run: node scripts/patch-release-0.6.42.mjs

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No release metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md solar_portal/README.md solar_portal/CHANGELOG.md solar_portal/config.yaml
          git commit -m "Publish Solario Local 0.6.42 metadata"
          git push origin HEAD:release/0.6.42

# Trigger after workflow creation.
